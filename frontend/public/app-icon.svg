<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13294D"/>
      <stop offset="1" stop-color="#0B1B33"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A6741E"/>
      <stop offset="0.42" stop-color="#E8B84B"/>
      <stop offset="0.6" stop-color="#FBF0C8"/>
      <stop offset="0.78" stop-color="#E8B84B"/>
      <stop offset="1" stop-color="#A6741E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.6">
      <stop offset="0" stop-color="#7FD5E8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#7FD5E8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- fondo -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- gota / sello de agua en oro -->
  <path d="M256 120 C 320 210, 360 262, 360 320 a 104 104 0 0 1 -208 0 C 152 262, 192 210, 256 120 Z"
        fill="none" stroke="url(#gold)" stroke-width="14" stroke-linejoin="round"/>
  <!-- reflejo interior -->
  <path d="M232 250 C 212 286, 214 322, 240 344"
        fill="none" stroke="#FBF0C8" stroke-width="8" stroke-linecap="round" opacity="0.65"/>
  <!-- linea de horizonte de agua -->
  <line x1="150" y1="392" x2="362" y2="392" stroke="url(#gold)" stroke-width="9" stroke-linecap="round" opacity="0.7"/>
</svg>
